name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/hq-data.mjs  # worker/hq.json is generated (gitignored); the HQ API imports it
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run e2e
        env:
          CI: true
