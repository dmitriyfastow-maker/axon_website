<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaxo</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:17px/1.5 system-ui,-apple-system,sans-serif;background:#F5F2EC;color:#111;text-align:center;padding:24px}@media(prefers-color-scheme:dark){body{background:#0F0E0C;color:#f3efe8}}main{max-width:420px}img{width:170px;height:auto;display:block;margin:0 auto 10px}.l{font-weight:800;letter-spacing:.02em;font-size:20px;margin:0 0 18px}.l span{color:#d9a43a}h1{font-size:26px;line-height:1.2;margin:0 0 8px}p{margin:0 0 6px;opacity:.75}button{margin-top:18px;font:inherit;font-weight:700;padding:13px 24px;border-radius:999px;border:0;background:#f5b83d;color:#111;cursor:pointer}</style></head>
<body><main><p class="l">VAXO<span>.</span></p><img src="/mascot/vax-avatar.webp" alt="" width="170" height="170"><h1 id="h">No internet connection</h1><p id="p">Vax will be right back as soon as you are online. Check Wi-Fi or mobile data.</p><button id="b" onclick="location.reload()">Try again</button></main>
<script>
// One language: the one of the page the person opened (/ru/, /ua/), else the device language.
var T={en:['No internet connection','Vax will be right back as soon as you are online. Check Wi-Fi or mobile data.','Try again'],ru:['Нет подключения к интернету','Vax вернётся, как только появится связь. Проверьте Wi-Fi или мобильный интернет.','Попробовать снова'],ua:['Немає підключення до інтернету','Vax повернеться, щойно зʼявиться звʼязок. Перевірте Wi-Fi або мобільний інтернет.','Спробувати знову']};
var p=location.pathname,n=(navigator.language||'en').toLowerCase(),L=/^\/ru(\/|$)/.test(p)?'ru':/^\/ua(\/|$)/.test(p)?'ua':n.indexOf('uk')===0?'ua':n.indexOf('ru')===0?'ru':'en';
document.documentElement.lang=L==='ua'?'uk':L;['h','p','b'].forEach(function(id,i){document.getElementById(id).textContent=T[L][i]});
addEventListener('online',function(){location.reload()});
</script></body></html>
