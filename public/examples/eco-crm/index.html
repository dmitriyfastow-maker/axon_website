<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Vaxo OS — the owner's command center (demo)</title>
<meta name="description" content="Demo by Vaxo: one command center for the whole business — all chats with an AI manager, auto review replies, ads and marketing, content, CRM, team roles and a personal AI assistant for everyone.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--ink:#f2f3f5;--mut:#9aa1ad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 15% -10%,#2a2f7a 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#5a3a12 0,transparent 55%),var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
.w{max-width:1320px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
.bar b{font-size:19px;letter-spacing:-.03em}.bar b i{color:#e4a93f;font-style:normal}
.bar .tag{color:var(--mut);font-size:13px}
.langs{margin-left:auto;display:flex;gap:2px;background:#1a1d25;border-radius:99px;padding:3px}.langs button{border:0;background:none;color:var(--mut);border-radius:99px;padding:4px 10px;font-weight:700;font-size:12px}.langs button[aria-pressed=true]{background:#fff;color:#111}
.get{background:#e4a93f;color:#111;font-weight:800;text-decoration:none;padding:9px 16px;border-radius:99px;white-space:nowrap}
.hero{padding:34px 0 22px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:end}
.hero h1{font-size:clamp(32px,4.6vw,56px);line-height:1.04;letter-spacing:-.035em;margin:0 0 12px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#8c9bff,#e4a93f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c3c8d1;font-size:17px;margin:0;max-width:60ch}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pts span{background:#171a22;border:1px solid #262a35;border-radius:14px;padding:10px 12px;font-size:13.5px;color:#d5d9e0}
.niche{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}.niche small{color:var(--mut);margin-right:4px}
.niche button{border:1px solid #2b303c;background:#151820;color:#d5d9e0;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13.5px}
.niche button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}
.foot{color:var(--mut);font-size:13px;text-align:center;padding:26px 0 40px}.foot a{color:#e4a93f}
@media(max-width:860px){.hero{grid-template-columns:1fr}.pts{grid-template-columns:1fr}}
</style></head><body>
<div class="w">
  <div class="bar"><b>va<i>x</i>o</b><span class="tag" data-t="tag"></span>
    <div class="langs"><button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="ua">UA</button></div>
    <a class="get" href="/#chat" data-t="get"></a></div>
  <div class="hero"><div><h1 data-th="h1"></h1><p data-t="p"></p></div>
    <div class="pts"><span data-t="p1"></span><span data-t="p2"></span><span data-t="p3"></span><span data-t="p4"></span></div></div>
  <div class="niche"><small data-t="try"></small><button data-n="clinic" data-t="nc"></button><button data-n="shop" data-t="ns"></button><button data-n="biz" data-t="nb"></button></div>
  <div id="os"></div>
  <p class="foot"><span data-t="foot"></span> <a href="/#chat" data-t="get"></a></p>
</div>
<script src="/examples/_os/os.js"></script>
<script>
const I={
en:{tag:'Demo · Vaxo OS',get:'Get one for my business →',h1:'The whole business on <em>one screen</em>',p:'Every chat, review, ad, post, deal and employee — in one place. The AI manager answers clients 24/7, the assistant tells each person what to do today, and you see everything.',p1:'💬 All chats in one inbox — AI replies, you can step in',p2:'⭐ Reviews answered automatically, negatives sent to you',p3:'📣 Ads, content and brand — with AI budget advice',p4:'🔐 Roles and access for every employee',try:'Try it as:',nc:'Clinic',ns:'Online store',nb:'Services / agency',foot:'Fictional data. Yours is set up around how your business really works.'},
ru:{tag:'Демо · Vaxo OS',get:'Хочу такой для своего бизнеса →',h1:'Весь бизнес на <em>одном экране</em>',p:'Все чаты, отзывы, реклама, посты, сделки и сотрудники — в одном месте. ИИ-менеджер отвечает клиентам 24/7, помощник подсказывает каждому, что сделать сегодня, а вы видите всё.',p1:'💬 Все чаты в одном окне — отвечает ИИ, вы можете вмешаться',p2:'⭐ На отзывы отвечает ИИ, негатив сразу приходит вам',p3:'📣 Реклама, контент и бренд — с советами ИИ по бюджету',p4:'🔐 Роли и доступы для каждого сотрудника',try:'Попробуйте как:',nc:'Клиника',ns:'Интернет-магазин',nb:'Услуги / агентство',foot:'Данные вымышленные. Ваш пульт настроим под то, как на самом деле работает ваш бизнес.'},
ua:{tag:'Демо · Vaxo OS',get:'Хочу такий для свого бізнесу →',h1:'Весь бізнес на <em>одному екрані</em>',p:'Усі чати, відгуки, реклама, пости, угоди й працівники — в одному місці. ШІ-менеджер відповідає клієнтам 24/7, помічник підказує кожному, що зробити сьогодні, а ви бачите все.',p1:'💬 Усі чати в одному вікні — відповідає ШІ, ви можете втрутитися',p2:'⭐ На відгуки відповідає ШІ, негатив одразу приходить вам',p3:'📣 Реклама, контент і бренд — з порадами ШІ щодо бюджету',p4:'🔐 Ролі й доступи для кожного працівника',try:'Спробуйте як:',nc:'Клініка',ns:'Інтернет-магазин',nb:'Послуги / агенція',foot:'Дані вигадані. Ваш пульт налаштуємо під те, як насправді працює ваш бізнес.'}};
const AC={clinic:['#2f5d4c','#B9785B'],shop:['#7a3324','#B88A57'],biz:['#3b4fd6','#e4a93f']};
const $$=s=>document.querySelectorAll(s);
let lang=(()=>{const u=new URLSearchParams(location.search).get('lang');if(u&&I[u])return u;try{const s=localStorage.getItem('vaxo_demo_lang');if(s&&I[s])return s}catch{}const n=(navigator.language||'en').slice(0,2);return n==='ru'?'ru':n==='uk'?'ua':'en'})();
let niche=new URLSearchParams(location.search).get('niche');if(!AC[niche])niche='clinic';
function apply(){const d=I[lang];document.documentElement.lang=lang==='ua'?'uk':lang;$$('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);$$('[data-th]').forEach(e=>e.innerHTML=d[e.dataset.th]);$$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));$$('[data-n]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.n===niche))}
$$('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('vaxo_demo_lang',lang)}catch{}apply();VaxoOS.lang(lang)});
$$('[data-n]').forEach(b=>b.onclick=()=>{niche=b.dataset.n;apply();VaxoOS.niche(niche,...AC[niche])});
apply();VaxoOS.mount(document.getElementById('os'),{lang,niche,accent:AC[niche][0],accent2:AC[niche][1]});
const h=location.hash.slice(1);if(h)VaxoOS.go(h);
</script>
</body></html>
