<style>
:root{--bg:#0e0c12;--ink:#f6f1ea;--mut:#a9a3b3;--line:rgba(255,255,255,.1);--a:#f2b8a0;--b:#c9a7ff;--g:#7ee0b5;--card:#1a1720;--app:#fbf8f4;--appInk:#1c1820;--appMut:#7d7584;--appLine:#ece5dd;--rose:#d9826b;--plum:#6d4ca8;--serif:"Fraunces",Georgia,serif;--body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:radial-gradient(900px 600px at 80% -10%,rgba(201,167,255,.18),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(242,184,160,.16),transparent 60%),var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.vx{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center;background:var(--ink);color:#16131a;font:600 12.5px/1.3 var(--body);padding:9px 16px;text-align:center}
.vx a{background:#16131a;color:var(--ink);padding:5px 12px;border-radius:999px;text-decoration:none}
.vx .lg{display:flex;gap:4px}.vx .lg button{padding:3px 8px;border-radius:999px;font-weight:700;font-size:11px;color:#16131a}.vx .lg button.on{background:#16131a;color:var(--ink)}
.page{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,40px);display:grid;grid-template-columns:1fr 400px;gap:clamp(28px,5vw,72px);align-items:center}
.copy .tag{color:var(--a);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.copy h1{font:600 clamp(34px,4.6vw,58px)/1.05 var(--serif);margin:14px 0 16px;letter-spacing:-.01em}
.copy h1 em{font-style:normal;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.copy p.lead{color:var(--mut);font-size:18px;max-width:520px}
.feats{display:grid;gap:10px;margin:26px 0;max-width:520px}
.feat{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%;transition:border-color .2s,background .2s}
.feat:hover,.feat.on{border-color:rgba(242,184,160,.6);background:rgba(242,184,160,.07)}
.feat i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-style:normal;font-size:18px}
.feat b{display:block;font-size:15.5px}.feat small{color:var(--mut);font-size:13.5px}
.cta{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--a),var(--b));color:#16131a;font-weight:700;padding:14px 22px;border-radius:999px;text-decoration:none}
.note{color:var(--mut);font-size:13px;margin-top:12px}

.phone{position:relative;width:390px;max-width:100%;aspect-ratio:390/800;margin:0 auto;border-radius:54px;background:#08070a;padding:12px;box-shadow:0 50px 120px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08) inset}

.scr{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--app);color:var(--appInk);display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;padding:16px 28px 6px;font:600 13px var(--body)}
.view{flex:1;overflow-y:auto;padding:8px 18px 18px;scrollbar-width:none}.view::-webkit-scrollbar{display:none}
.v{display:none;animation:in .35s ease}.v.on{display:block}

.hi{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.hi small{color:var(--appMut);font-size:12.5px}.hi h2{font:600 24px/1.15 var(--serif)}
.ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--plum));color:#fff;display:grid;place-items:center;font-weight:700}
.card{background:#fff;border:1px solid var(--appLine);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px -18px rgba(60,30,40,.4)}

.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);color:inherit}
.pill.w{background:#fff;color:#2a2033}
.offer{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ffe7dc,#f3e8ff);border:0}

.qa button{background:#fff;border:1px solid var(--appLine);border-radius:16px;padding:10px 4px;font-size:11.5px;font-weight:600;display:grid;gap:4px;justify-items:center;color:var(--appInk)}

h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--appMut);margin:14px 0 8px}

.chip.on{background:var(--appInk);color:#fff;border-color:var(--appInk)}
.chip small{display:block;font-weight:500;font-size:11px;opacity:.7}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days .chip{border-radius:16px;min-width:56px;text-align:center}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slots .chip{text-align:center;padding:9px 0}
.slots .chip:disabled{opacity:.35;text-decoration:line-through;cursor:default}
.masters{display:flex;gap:10px}
.mst{display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--appInk)}
.mst i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;border:3px solid transparent}
.mst.on i{border-color:var(--appInk)}
.go{width:100%;margin-top:16px;padding:15px;border-radius:16px;background:var(--appInk);color:#fff;font-weight:700}
.go:disabled{opacity:.4}
.ok{text-align:center;padding:30px 6px}
.ok .ck{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;background:var(--g);display:grid;place-items:center;font-size:34px;color:#0d3b2a;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.ok h3{font:600 24px var(--serif)}.ok p{color:var(--appMut);margin:8px 0 18px}
.bonus{background:linear-gradient(135deg,#2a2033,#6d4ca8);color:#fff;border:0;text-align:center;padding:20px}
.bonus .pts{font:600 44px/1 var(--serif);margin:6px 0}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#fff);border-radius:9px;width:0;transition:width 1.2s ease}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.stamps span{aspect-ratio:1;border-radius:50%;border:2px dashed var(--appLine);display:grid;place-items:center;font-size:16px}
.stamps span.on{border:0;background:linear-gradient(135deg,var(--rose),var(--plum));color:#fff}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:150px;aspect-ratio:1;margin:8px auto;gap:0;background:#fff;padding:8px;border-radius:12px}
.qr i{aspect-ratio:1}.qr i.k{background:#1c1820}
.hist div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--appLine);font-size:13.5px}.hist b.p{color:#2f9e6f}
.chat{display:flex;flex-direction:column;gap:8px;min-height:100%}
.msg{max-width:85%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.45;animation:in .3s ease}

.typing{display:flex;gap:4px;padding:14px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--appMut);animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
