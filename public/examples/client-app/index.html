$('#cls').onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;const i=b.dataset.b;bk[i]=!bk[i];left+=bk[i]?-1:1;$('#lf').textContent=left;$('#ts').textContent=bk[i]?T[L].done:'';cls()};
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.scr').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b))});
$('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v)return;const d=document.createElement('div');d.className='msg me';d.textContent=v;$('#mm').appendChild(d);$('#ci').value=''};
$$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});$$('.rv').forEach(e=>io.observe(e));
setLang('en');try{const q=new URLSearchParams(location.search).get('lang')||localStorage.getItem('ps-l');if(q&&T[q]&&q!=='en')setLang(q)}catch(e){}
</script></body></html>
