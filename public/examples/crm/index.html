<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurelia HQ — your whole business on one screen · Vaxo demo</title>
<meta name="description" content="Interactive CRM demo: Instagram, WhatsApp, Telegram and site chats in one inbox, deals, calendar, money, team and an AI assistant. By Vaxo.">
<meta name="theme-color" content="#F5F2EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EC;--s1:#FFFFFF;--s2:#F8F6F1;--s3:#EEE9DF;--line:rgba(23,21,15,.075);--line2:rgba(23,21,15,.13);--ink:#17150F;--mute:#6B6457;--faint:#A39B8C;--acc:#E4A93F;--acct:#865800;--accs:#FBF2DF;--on:#17150F;--ok:#2B8154;--bad:#B9402D;--blue:#3B5FC4;--glass:rgba(255,253,249,.62);--sh1:0 1px 2px rgba(40,30,10,.05);--sh2:0 1px 2px rgba(40,30,10,.04),0 6px 16px -6px rgba(40,30,10,.07),0 18px 40px -18px rgba(40,30,10,.10);--sh3:0 2px 6px rgba(40,30,10,.06),0 28px 70px -16px rgba(40,30,10,.25);--r:18px;--b:'Onest','Inter',system-ui,-apple-system,sans-serif;--tab:64px;--ease:cubic-bezier(.2,.8,.2,1)}
[data-theme=dark]{--bg:#0F0E0C;--s1:#181713;--s2:#1E1C18;--s3:#2A2722;--line:rgba(245,242,236,.07);--line2:rgba(245,242,236,.13);--ink:#F5F2EC;--mute:#A59E90;--faint:#6F695E;--acct:#E8B65A;--accs:rgba(228,169,63,.12);--ok:#5FC08F;--bad:#F08872;--blue:#8EA9F2;--glass:rgba(24,23,19,.62);--sh1:0 1px 2px rgba(0,0,0,.3);--sh2:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.55);--sh3:0 30px 80px -20px rgba(0,0,0,.75)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;color-scheme:light}
[data-theme=dark]{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--b);overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100dvh;letter-spacing:-.005em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(228,169,63,.07),transparent 60%)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}
.skip{position:absolute;left:-999px;top:0;z-index:99;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:0 0 10px 0}
.skip:focus{left:0}
.num{font-variant-numeric:lining-nums}
b,strong{font-weight:600}
/* strip */
.strip{position:relative;z-index:5;background:#17150F;color:#EDE6D8;font:500 13px/1.35 var(--b);text-align:center;padding:9px 16px}
.strip a{color:#E8B65A;font-weight:600;text-decoration:none;white-space:nowrap;border-bottom:1px solid rgba(232,182,90,.5)}
.strip a:hover{border-color:#E8B65A}
/* shell */
.app{position:relative;display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100dvh - 38px)}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:14px;padding:20px 14px 16px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);z-index:2}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 10px}
.mark{position:relative;width:32px;height:32px;border-radius:10px;flex:none;background:#17150F;box-shadow:var(--sh1),inset 0 0 0 1px rgba(255,255,255,.06)}
.mark:after{content:"";position:absolute;inset:9px;border-radius:50%;border:2.5px solid #E4A93F;border-right-color:transparent;transform:rotate(-30deg)}
[data-theme=dark] .mark{background:#F5F2EC}
.brand b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.brand small{color:var(--mute);font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:10px;color:var(--mute);font-weight:500;font-size:14px;text-align:left;transition:background .2s,color .2s}
.nav button:hover{background:rgba(23,21,15,.04);color:var(--ink)}
[data-theme=dark] .nav button:hover{background:rgba(255,255,255,.04)}
.nav button[aria-current=page]{color:var(--ink);background:var(--s1);box-shadow:var(--sh1),0 0 0 1px var(--line)}
.nav button[aria-current=page] svg{color:var(--acct)}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:600;min-width:20px;padding:1px 7px;border-radius:99px;background:var(--acc);color:#17150F;text-align:center}
.nav .cnt.soft{background:transparent;color:var(--faint)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.streakc{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh1)}
.flame{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accs);color:#D08A1C;flex:none}
.flame svg{width:17px;height:17px;fill:currentColor;stroke:none}
.streakc b{display:block;font-size:13.5px}
.streakc small{color:var(--mute);font-size:12px;line-height:1.3;display:block}
.morex{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;color:var(--mute);font-weight:500;font-size:13.5px;text-decoration:none;transition:background .2s,color .2s}
.morex:hover{color:var(--ink);background:rgba(23,21,15,.04)}
.byv{font-size:12px;color:var(--faint);padding:0 12px}
.byv a{color:var(--mute);font-weight:600;text-decoration:none}
/* top bar */
.main{min-width:0;display:flex;flex-direction:column;position:relative;z-index:1}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 36px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid transparent;transition:border-color .2s}
.mtitle{display:none;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.02em;min-width:0}
.mtitle .mark{width:28px;height:28px;border-radius:9px}
.mtitle .mark:after{inset:8px;border-width:2.2px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:11px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh1);color:var(--faint);font-size:14px;transition:border-color .2s,box-shadow .2s}
.search:hover{border-color:var(--line2);box-shadow:var(--sh2)}
.search span[data-i]{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
kbd{font:500 11px var(--b);padding:2px 6px;border-radius:6px;background:var(--s2);color:var(--mute);border:1px solid var(--line)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;padding:3px;border-radius:10px;background:rgba(23,21,15,.05);gap:2px}
[data-theme=dark] .seg{background:rgba(255,255,255,.06)}
.seg button{font:500 12px var(--b);padding:5px 10px;border-radius:7px;color:var(--mute);letter-spacing:.01em;transition:background .2s,color .2s,box-shadow .2s}
.seg [data-lang]{text-transform:uppercase}
.seg button[aria-pressed=true]{background:var(--s1);color:var(--ink);box-shadow:var(--sh1),0 0 0 1px var(--line)}
.ib{position:relative;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute);transition:background .2s,color .2s}
.ib:hover{background:rgba(23,21,15,.05);color:var(--ink)}
[data-theme=dark] .ib:hover{background:rgba(255,255,255,.06)}
.ib .dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#17150F;font:600 10px/16px var(--b);text-align:center;box-shadow:0 0 0 2px var(--bg);animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(0)}}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--accs);color:var(--acct);flex:none;box-shadow:0 0 0 1px var(--line)}
.bellw{position:relative}
.drop{position:absolute;right:0;top:46px;width:340px;max-width:calc(100vw - 32px);padding:8px;border-radius:16px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh3);opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:.22s var(--ease);transform-origin:top right}
.drop.on{opacity:1;transform:none;pointer-events:auto}
.drop h4{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px;font-size:14px;font-weight:600}
.drop h4 button{font-size:12.5px;color:var(--acct);font-weight:500}
.ni{display:flex;gap:10px;padding:10px;border-radius:10px;font-size:13.5px;line-height:1.4}
.ni:hover{background:var(--s2)}
.ni i{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:7px;flex:none}
.ni.read i{background:var(--s3)}
.ni.read{color:var(--mute)}
.ni small{display:block;color:var(--faint);font-size:12px;margin-top:1px}
/* content */
main{padding:28px 36px 56px;min-width:0;flex:1;max-width:1320px;width:100%;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:vin .5s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.vh h1{font-size:clamp(26px,2.6vw,34px);font-weight:600;line-height:1.1;letter-spacing:-.035em}
.vh p{color:var(--mute);margin-top:6px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--s2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.gold{background:var(--accs);border-color:transparent;color:var(--acct)}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent);border-color:transparent}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent);border-color:transparent}
.card{position:relative;min-width:0;border-radius:var(--r);padding:22px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh2)}
.card h3{font-size:15px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--faint);font-weight:400;font-size:13px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;font-weight:500;font-size:13.5px;transition:transform .2s var(--ease),box-shadow .2s,background .2s,border-color .2s}
.btn.pri{background:var(--ink);color:var(--bg);box-shadow:var(--sh1)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.btn.gh{background:var(--s1);border:1px solid var(--line2);box-shadow:var(--sh1)}
.btn.gh:hover{border-color:var(--faint)}
.btn svg{width:15px;height:15px}
.g{display:grid;gap:20px}
/* today */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;margin:12px 0 32px}
.greet{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:15px;margin-bottom:14px;flex-wrap:wrap}
.greet .dt{display:inline-flex;align-items:center;gap:7px;color:var(--faint)}
.greet .dt:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.sum{font-size:clamp(28px,3.3vw,44px);font-weight:500;line-height:1.18;letter-spacing:-.04em;max-width:880px;text-wrap:balance}
.sumk{font-weight:600;color:var(--ink);padding:0 .08em;border-radius:6px;background:linear-gradient(transparent 62%,rgba(228,169,63,.32) 62%);transition:background .3s}
[data-theme=dark] .sumk{background:linear-gradient(transparent 64%,rgba(228,169,63,.24) 64%)}
.sumk:hover{background:linear-gradient(transparent 0,rgba(228,169,63,.22) 0)}
.hsub{color:var(--mute);margin-top:14px;font-size:15.5px}
.goal{display:flex;align-items:center;gap:14px;padding:14px 20px 14px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh2)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:var(--s3)}
.ring .pr{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.6s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600}
.goal strong{display:block;font-size:14px}
.goal small{display:block;color:var(--mute);font-size:13px}
.goal .st{margin-top:5px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:#B5650F}
[data-theme=dark] .goal .st{color:#F0B05A}
.goal .st svg{width:13px;height:13px;fill:currentColor;stroke:none}
.tgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.plan{grid-column:span 5}
.aibadge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--acct)}
.aibadge svg{width:15px;height:15px}
.task{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 10px;border-radius:12px;transition:background .2s}
.task+.task{border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.task:hover{background:var(--s2)}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;transition:.3s var(--ease);margin-top:1px;background:var(--s1)}
.cb svg{width:13px;height:13px;stroke:#17150F;stroke-width:2.6;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .08s}
.task[aria-checked=true] .cb{background:var(--acc);border-color:var(--acc);animation:cbp .4s var(--ease)}
@keyframes cbp{50%{transform:scale(1.18)}}
.task[aria-checked=true] .cb svg{stroke-dashoffset:0}
.task span{font-size:14.5px;line-height:1.4}
.task small{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.task b{font-weight:500;transition:color .3s}
.task[aria-checked=true] span>b{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--faint)}
.prog{height:4px;border-radius:4px;background:var(--s3);margin-top:16px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:4px;transition:width .6s var(--ease)}
.alldone{display:none;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accs);color:var(--acct);font-size:13.5px;font-weight:500;animation:vin .5s var(--ease)}
.plan.done .alldone{display:flex}
.kpis{grid-column:span 7;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.kpi{padding:18px 20px 14px;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh3)}
.kpi .lb{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:13.5px}
.kpi .v{font-size:clamp(26px,2.4vw,32px);font-weight:600;line-height:1.15;letter-spacing:-.04em;margin:6px 0 2px}
.dl{font-size:12.5px;font-weight:500;padding:1px 7px;border-radius:99px}
.dl.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.kpi svg.sp{width:100%;height:40px;display:block;margin-top:10px;overflow:visible}
.sp .ln{fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .2s var(--ease) forwards}
.sp .ar{opacity:0;animation:fade .8s .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.demo{font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--faint);padding:2px 8px;border-radius:99px;background:var(--s2);border:1px solid var(--line)}
.feed{grid-column:span 7}
.fi{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.fi:first-of-type{border-top:0;padding-top:0}
.fi.new{animation:slin .6s var(--ease)}
@keyframes slin{from{opacity:0;transform:translateY(-8px)}}
.fic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--s2);color:var(--mute);border:1px solid var(--line)}
.fic svg{width:16px;height:16px}
.fi p{flex:1;font-size:14px;line-height:1.4;min-width:0;color:var(--mute)}
.fi p b{color:var(--ink);font-weight:500}
.fi time{color:var(--faint);font-size:12.5px;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ok)}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.next{grid-column:span 5}
.bk{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.bk:first-of-type{border-top:0;padding-top:0}
.bk time{font-weight:500;font-size:14px;width:46px;color:var(--mute)}
.bk i{width:3px;align-self:stretch;border-radius:3px}
.bk p{font-weight:500;font-size:14.5px;line-height:1.3}
.bk small{display:block;color:var(--mute);font-size:13px}
/* inbox */
.inbox{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100dvh - 220px);min-height:520px;padding:0;overflow:hidden}
.ilist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--s2)}
.filt{display:flex;gap:4px;padding:14px;overflow-x:auto;scrollbar-width:none;flex:none}
.filt button{padding:5px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mute);white-space:nowrap;transition:background .2s,color .2s}
.filt button:hover{color:var(--ink)}
.filt button[aria-pressed=true]{background:var(--s1);color:var(--ink);box-shadow:var(--sh1),0 0 0 1px var(--line)}
.chats{overflow-y:auto;flex:1;padding:0 8px 8px}
.ci{display:flex;gap:12px;width:100%;text-align:left;padding:11px 10px;border-radius:12px;transition:background .2s;align-items:flex-start}
.ci:hover{background:rgba(23,21,15,.035)}
[data-theme=dark] .ci:hover{background:rgba(255,255,255,.03)}
.ci[aria-selected=true]{background:var(--s1);box-shadow:var(--sh1),0 0 0 1px var(--line)}
.av{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;color:#3A2E18}
.chb{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:6px;display:grid;place-items:center;font:700 7.5px/1 var(--b);color:#fff;box-shadow:0 0 0 2px var(--s1);letter-spacing:0}
.ch-ig{background:linear-gradient(45deg,#f5a14e,#de3b77 55%,#8a45b8)}
.ch-wa{background:#25a660}
.ch-tg{background:#2a9fd6}
.ch-web{background:#E4A93F;color:#17150F!important}
.ci .tx{flex:1;min-width:0;display:block}
.ci .r1{display:flex;justify-content:space-between;gap:8px;font-weight:500;font-size:14px}
.ci .r1 time{font-size:12px;color:var(--faint);font-weight:400}
.ci .pv{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ci.unr .r1{font-weight:600}
.ci.unr .pv{color:var(--ink)}
.ci .ud{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:7px;flex:none}
.thread{display:flex;flex-direction:column;min-height:0;min-width:0}
.th{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex:none}
.th b{display:block;font-size:15px;font-weight:600}
.th small{color:var(--mute);font-size:12.5px}
.th .back{display:none}
.msgs{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:8px}
.m{max-width:min(76%,520px);padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;animation:bub .4s var(--ease)}
@keyframes bub{from{opacity:0;transform:translateY(6px)}}
.m.c{background:var(--s2);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.m.ai{align-self:flex-end;border-bottom-right-radius:5px;background:var(--accs);color:var(--ink);border:1px solid rgba(228,169,63,.25)}
.m.me{align-self:flex-end;border-bottom-right-radius:5px;background:var(--ink);color:var(--bg)}
.aim{align-self:flex-end;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--acct);margin:0 4px 6px}
.aim svg{width:12px;height:12px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:13px 14px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{30%{transform:translateY(-4px);opacity:.5}}
.reply{flex:none;padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--s1)}
.reply .rb{display:flex;gap:6px;align-items:flex-end;background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--sh1);transition:border-color .2s,box-shadow .2s}
.reply .rb:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(228,169,63,.14)}
.reply textarea{scrollbar-width:thin;flex:1;border:0;background:none;resize:none;outline:0;font-size:14.5px;line-height:1.45;padding:7px 0;max-height:120px;min-width:0}
.reply textarea::placeholder{color:var(--faint)}
.sug{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--acct);background:var(--accs);white-space:nowrap;transition:transform .2s var(--ease)}
.sug:hover{transform:translateY(-1px)}
.sug svg{width:15px;height:15px}
.snd{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg);flex:none;transition:transform .2s var(--ease)}
.snd:hover{transform:scale(1.05)}
.snd svg{width:16px;height:16px}
.rnote{font-size:12.5px;color:var(--faint);margin-top:8px;display:flex;align-items:center;gap:6px}
.rnote svg{width:13px;height:13px;color:var(--acct)}
/* deals */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
.col{border-radius:16px;padding:10px;background:rgba(23,21,15,.025);border:1px solid var(--line);min-height:260px;transition:background .2s,border-color .2s,box-shadow .2s}
[data-theme=dark] .col{background:rgba(255,255,255,.02)}
.col.over{border-color:rgba(228,169,63,.6);background:rgba(228,169,63,.06);box-shadow:0 0 0 4px rgba(228,169,63,.08)}
.colh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px;gap:8px}
.colh b{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.colh b i{width:8px;height:8px;border-radius:50%}
.colh b span{color:var(--faint);font-weight:400}
.colh .tot{font-weight:500;font-size:13px;color:var(--mute)}
.colh .tot.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12);color:var(--acct)}}
.cards{display:flex;flex-direction:column;gap:8px;min-height:120px}
.cards:empty{display:grid;place-items:center;border:1.5px dashed var(--line2);border-radius:12px;min-height:120px}
.cards:empty:after{content:attr(data-empty);color:var(--faint);font-size:13px;padding:16px;text-align:center}
.deal{position:relative;padding:14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh1);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s var(--ease),box-shadow .2s,opacity .2s}
.deal:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.deal.ph{opacity:.35;box-shadow:none;border-style:dashed}
.deal.lift{transform:scale(1.02);box-shadow:var(--sh3)}
.deal.ghost{position:fixed;z-index:80;margin:0;pointer-events:none;cursor:grabbing;box-shadow:var(--sh3);transition:none;rotate:1.5deg;scale:1.02}
.deal .dt{font-weight:500;font-size:14px;line-height:1.35}
.deal .dm{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.deal .dv{font-weight:600;font-size:14.5px}
.deal .dw{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12.5px;min-width:0}
.deal .dw .av{width:22px;height:22px;font-size:9.5px}
.deal .tg{font-size:12px;color:var(--faint);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.deal .hot{color:#B5650F;font-weight:500}
[data-theme=dark] .deal .hot{color:#F0B05A}
/* calendar */
.days{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.days button{flex:1;min-width:42px;padding:8px 2px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:11.5px;color:var(--mute);line-height:1.2;box-shadow:var(--sh1);transition:background .2s}
.days button b{display:block;font-size:16px;color:var(--ink);font-weight:600}
.days button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days button[aria-pressed=true] b{color:var(--bg)}
.wk{--h:52px;display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));padding:0;overflow:hidden}
.wk .hd{position:sticky;top:0;padding:12px 6px 10px;text-align:center;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--s1);text-transform:capitalize}
.wk .hd b{display:grid;place-items:center;width:32px;height:32px;margin:2px auto 0;border-radius:50%;font-size:17px;color:var(--ink);font-weight:600}
.wk .hd.td{color:var(--acct)}
.wk .hd.td b{background:var(--acc);color:#17150F}
.wk .hd.c0{border-left:0}
.tcol{position:relative}
.tcol span{display:block;height:var(--h);font-size:11.5px;color:var(--faint);text-align:right;padding-right:10px;transform:translateY(-8px)}
.tcol span:first-child{visibility:hidden}
.dcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h) - 1px),var(--line) calc(var(--h) - 1px),var(--line) var(--h))}
.dcol.td{background-color:rgba(228,169,63,.035)}
.ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.3;overflow:hidden;text-align:left;border-left:2.5px solid;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s;animation:evin .5s var(--ease) backwards}
.ev:hover{transform:translateY(-1px);z-index:2;box-shadow:var(--sh2)}
.ev b{display:block;font-weight:600}
.ev small{color:var(--mute);font-size:11.5px}
@keyframes evin{from{opacity:0;transform:translateY(4px)}}
.nowl{position:absolute;left:0;right:0;height:1.5px;background:var(--bad);z-index:3}
.nowl:before{content:"";position:absolute;left:-4px;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:8px;height:8px;border-radius:50%}
/* marketing */
.mg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.post{border-radius:14px;overflow:hidden;background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh1);transition:transform .3s var(--ease),box-shadow .3s}
.post:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.pimg{position:relative;aspect-ratio:4/5;display:flex;align-items:flex-end;padding:14px;color:#17150F;font-size:16.5px;font-weight:600;line-height:1.2;letter-spacing:-.025em}
.pimg .chb{position:absolute;top:10px;left:10px;right:auto;bottom:auto;box-shadow:none;width:22px;height:22px;font-size:8px}
.pimg .pd{position:absolute;top:10px;right:10px;font-size:11.5px;font-weight:500;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);padding:3px 8px;border-radius:99px;letter-spacing:0;text-transform:capitalize}
.post .pm{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--faint);font:400 10px var(--b)}
.chart .vl{fill:var(--ink);font-weight:500}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1s var(--ease) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.chn{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;margin-top:12px;font-size:13.5px}
.chn .tr{height:6px;border-radius:6px;background:var(--s3);overflow:hidden}
.chn .tr i{display:block;height:100%;border-radius:6px;transform-origin:left;animation:grx 1.1s var(--ease) backwards}
@keyframes grx{from{transform:scaleX(0)}}
.chn em{font-style:normal;color:var(--faint);font-size:12.5px}
.tip{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--accs);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.tip svg{color:var(--acct);margin-top:2px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stats3 div{padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.stats3 small{display:block;color:var(--mute);font-size:12.5px}
.stats3 b{font-size:20px;font-weight:600;letter-spacing:-.03em}
/* money */
.mtop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:20px}
.mt .v{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.04em;margin-top:6px}
.mt small{color:var(--mute);font-size:13.5px;display:flex;align-items:center;gap:7px}
.mt small:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
.mg2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
.inv{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.inv:first-of-type{border-top:0;padding-top:0}
.inv .nm{flex:1;min-width:0}
.inv .nm b{display:block;font-size:14px;font-weight:500}
.inv .nm small{color:var(--faint);font-size:12.5px}
.inv .am{font-weight:600;font-size:14.5px;white-space:nowrap}
.inv .btn{padding:6px 11px;font-size:12.5px;border-radius:9px}
/* team */
.tg2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.mem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mem:first-of-type{border-top:0;padding-top:0}
.mem .nm{flex:1;min-width:0}
.mem b{display:block;font-size:14.5px;font-weight:500}
.mem small{color:var(--mute);font-size:13px}
.role{font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px}
.role.owner{background:var(--accs);color:var(--acct)}
.role.manager{background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--blue)}
.role.viewer{background:var(--s2);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;margin-top:4px}
.mx th,.mx td{padding:11px 8px;text-align:center;border-top:1px solid var(--line);transition:background .25s}
.mx th:first-child,.mx td:first-child{text-align:left;font-weight:400;color:var(--ink)}
.mx thead th{border-top:0;font-size:12.5px;color:var(--mute);font-weight:500}
.mx td.hl,.mx th.hl{background:rgba(228,169,63,.07)}
.mx thead th.hl{color:var(--acct);border-radius:10px 10px 0 0}
.mx tbody tr:last-child td.hl{border-radius:0 0 10px 10px}
.lv{display:inline-block;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:7px}
.lv.f{color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.lv.e{color:var(--blue);background:color-mix(in srgb,var(--blue) 9%,transparent)}
.lv.v{color:var(--mute);background:var(--s2)}
.lv.n{color:var(--faint)}
.rsum{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:14px;min-height:48px;display:flex;gap:10px;align-items:flex-start;color:var(--mute)}
.rsum svg{color:var(--acct);margin-top:2px}
.lb2{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.lb2 .tr{flex:1;height:6px;border-radius:6px;background:var(--s3);overflow:hidden}
.lb2 .tr i{display:block;height:100%;background:var(--acc);border-radius:6px;transform-origin:left;animation:grx 1.2s var(--ease) backwards}
.medal{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:var(--s2);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.medal.g{background:var(--acc);color:#17150F;box-shadow:none}
/* ai */
.aiw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.aibox{display:flex;flex-direction:column;height:calc(100dvh - 240px);min-height:480px;padding:0;overflow:hidden}
.aimsgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.aimsgs>:first-child,.msgs>:first-child{margin-top:auto}
.aimsgs .m.c{align-self:flex-end;background:var(--ink);color:var(--bg);border:0;border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.aimsgs .m.a{align-self:flex-start;background:var(--s2);border:1px solid var(--line);border-bottom-left-radius:5px;max-width:min(86%,600px)}
.aimsgs .m.a b{color:var(--ink);font-weight:600;background:linear-gradient(transparent 62%,rgba(228,169,63,.3) 62%)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px}
.chips button{padding:7px 12px;border-radius:99px;font-size:13px;background:var(--s1);border:1px solid var(--line2);color:var(--mute);transition:border-color .2s,color .2s,transform .2s var(--ease)}
.chips button:hover{border-color:var(--acc);color:var(--ink);transform:translateY(-1px)}
.orb{width:64px;height:64px;border-radius:20px;margin:4px auto 16px;display:grid;place-items:center;background:var(--accs);color:var(--acct);animation:breathe 4s ease-in-out infinite}
.orb svg{width:28px;height:28px}
@keyframes breathe{50%{transform:scale(1.05)}}
.aside p{color:var(--mute);font-size:14px;text-align:center;text-wrap:balance}
.aside ul{list-style:none;margin-top:18px;display:grid;gap:4px}
.aside li{display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 4px;border-top:1px solid var(--line)}
.aside li svg{color:var(--acct);width:16px;height:16px}
/* footer */
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 36px 28px;color:var(--faint);font-size:13px;border-top:1px solid var(--line);max-width:1320px;width:100%;margin:0 auto}
.foot a{color:var(--mute);font-weight:500;text-decoration:none}
.foot a:hover{color:var(--ink)}
/* palette */
.ov{position:fixed;inset:0;z-index:90;background:rgba(23,21,15,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:14vh 16px 16px}
[data-theme=dark] .ov{background:rgba(0,0,0,.5)}
.ov.on{display:flex;animation:fade .2s forwards;opacity:0}
.palb{width:min(580px,100%);border-radius:16px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh3);overflow:hidden;animation:pin .28s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.pali{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--faint)}
.pali input{flex:1;border:0;background:none;outline:0;font-size:16px;min-width:0;color:var(--ink)}
.pali input::placeholder{color:var(--faint)}
.pall{max-height:min(380px,50vh);overflow-y:auto;padding:6px;list-style:none}
.pall li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--mute)}
.pall li span{color:var(--ink)}
.pall li[aria-selected=true]{background:var(--s2)}
.pall li[aria-selected=true] svg{color:var(--acct)}
.pall li small{margin-left:auto;color:var(--faint);font-size:12px}
.pall .empty{color:var(--faint);justify-content:center;cursor:default;padding:24px}
/* sheet + tabbar */
.tabbar{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:10px 16px calc(var(--tab) + 20px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--s1);box-shadow:var(--sh3);transform:translateY(105%);transition:transform .38s var(--ease)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 16px}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sgrid button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-weight:500;font-size:14.5px}
.sgrid button svg{color:var(--acct)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:14.5px}
.srow>span{font-weight:500!important}
.shade{position:fixed;inset:0;z-index:65;background:rgba(23,21,15,.2);opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
/* toasts */
.toasts{position:fixed;z-index:95;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:500;font-size:14px;box-shadow:var(--sh3);animation:tin .45s var(--ease)}
.toast svg{color:var(--acc)}
.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.97)}}
.cf{position:fixed;z-index:96;width:7px;height:10px;border-radius:2px;pointer-events:none}
/* responsive */
@media (max-width:1180px){.plan,.kpis,.feed,.next{grid-column:span 12}.mg,.mg2,.tg2,.aiw{grid-template-columns:minmax(0,1fr)}.aiw .aside{display:none}.inbox{grid-template-columns:280px minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}.goal{justify-self:start}}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .top{padding:10px 16px;gap:6px}
 .mtitle{display:flex}
 .search{flex:0 0 36px;width:36px;height:36px;padding:0;justify-content:center;margin-left:auto;border:0;box-shadow:none;background:none;color:var(--mute)}
 .search span[data-i],.search kbd,.tools .seg,#themeBtn,.tools .ava{display:none}
 .tools{margin-left:0}
 main{padding:16px 16px calc(var(--tab) + 32px + env(safe-area-inset-bottom))}
 .foot{padding:16px 16px calc(var(--tab) + 28px + env(safe-area-inset-bottom));display:block}
 .foot>*{display:block;margin-top:6px}
 .hero{margin:4px 0 22px;gap:20px}
 .sum{font-size:27px}
 .goal{width:100%}
 .tgrid,.g{gap:14px}
 .kpis{gap:12px}
 .kpi{padding:14px 14px 10px}
 .kpi .lb{font-size:12.5px}
 .kpi .lb .dl{display:none}
 .kpi .v{font-size:24px}
 .card{padding:18px;border-radius:16px}
 .vh{margin-bottom:18px}
 .inbox{grid-template-columns:minmax(0,1fr);height:auto;min-height:0;overflow:visible;background:none;border:0;box-shadow:none;padding:0}

 .cards,.cards:empty{min-height:64px}
 .days{display:flex}
