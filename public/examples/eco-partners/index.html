const $=id=>document.getElementById(id),$$=s=>document.querySelectorAll(s);
let lang=(()=>{const u=new URLSearchParams(location.search).get('lang');if(u&&I[u])return u;try{const s=localStorage.getItem('vaxo_demo_lang');if(s&&I[s])return s}catch{}const n=(navigator.language||'en').slice(0,2);return n==='ru'?'ru':n==='uk'?'ua':'en'})();
const t=k=>I[lang][k],f=(k,m)=>t(k).replace(/\{(\w)\}/g,(_,x)=>m[x]);
const L=[["Bronze",15,0],["Silver",20,3],["Gold",25,8],["Platinum",30,20]];
const D0=[["10/28","Nordic Bakery",400,"paid"],["10/24","Helio Dental",900,"paid"],["10/19","Kora Studio",350,"paid"],["10/11","Atlas Garage",600,"paid"]];
let s={clicks:128,signups:19,paid:4,earned:640,paidOut:0,pend:D0.slice()};
function toast(x){const e=$("toast");e.textContent=x;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
function confetti(){for(let i=0;i<40;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=['#7c5cff','#22d3a6','#ffc24b','#ff5fa2'][i%4];c.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2200)}}
const lv=()=>{let i=0;L.forEach((l,j)=>{if(s.paid>=l[2])i=j});return i};
function draw(){const i=lv(),n=L[i+1];
 $("k1").textContent=s.clicks;$("k2").textContent=s.signups;$("k3").textContent=s.paid;$("k4").textContent="$"+s.earned;
 $("lvl").textContent=L[i][0];$("rate").textContent=L[i][1]+"%";
 const pr=n?Math.min(1,(s.paid-L[i][2])/(n[2]-L[i][2])):1;$("ringc").style.strokeDashoffset=314*(1-pr);
 $("progtx").textContent=n?f('more',{n:n[2]-s.paid,l:n[0],r:n[1]}):t('top');
 const tips=[s.signups/Math.max(s.clicks,1)<0.2?t('tipLow'):t('tipOk'),s.signups-s.paid>5?f('tipFollow',{n:s.signups-s.paid}):t('tipAll')];
 $("coach").innerHTML=tips.map(x=>`<p>• ${x}</p>`).join("")+`<p style="opacity:.75">${t('draft')}</p>`;
 $("tiers").innerHTML=L.map((l,j)=>`<div class="card ${j===i?"on":""}"><b>${l[0]}</b><br><span style="font-size:22px;font-weight:800;color:${['#cd8a5a','#c9cbe0','#ffc24b','#b9f3ff'][j]}">${l[1]}%</span><br><small style="color:var(--mut)">${l[2]?l[2]+" "+t('plus'):t('start')}</small></div>`).join("");
 const av=s.pend.filter(p=>p[3]==="paid").reduce((a,p)=>a+Math.round(p[2]*L[i][1]/100),0)-s.paidOut;
 $("pt").innerHTML=s.pend.map(p=>`<tr><td>${p[0]==='T'?t('today'):p[0]}</td><td>${p[1]==='N'?t('newc'):p[1]}</td><td>$${p[2]}</td><td><b>$${Math.round(p[2]*L[i][1]/100)}</b></td><td><span class="pill ${p[3]==="paid"?"":"w2"}">${p[3]==="paid"?t('ok'):t('pend')}</span></td></tr>`).join("");
 $("wtx").textContent=t('avail')+"$"+Math.max(av,0);calc();board()}
function calc(){const n=+$("c1").value,p=+$("c2").value,r=L[lv()][1]/100;$("cn").textContent=n;$("cp").textContent="$"+p;$("cm").textContent="$"+Math.round(n*p*r).toLocaleString('en-US');$("cy").textContent="$"+Math.round(n*p*r*12).toLocaleString('en-US')}
function board(){const rows=[["sunny_k",12,"Gold"],["Dan.R",9,"Gold"],["lena_partners",7,"Silver"],["Mira ("+t('you')+")",s.paid,L[lv()][0],1],["ArtemV",3,"Silver"],["olga.m",2,"Bronze"]].sort((a,b)=>b[1]-a[1]);
 $("lb").innerHTML=rows.map((r,i)=>`<tr class="${r[3]?"me":""}"><td class="medal">${['🥇','🥈','🥉'][i]||i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
function applyLang(){document.documentElement.lang=lang==='ua'?'uk':lang;$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$$('[data-th]').forEach(e=>e.innerHTML=t(e.dataset.th));$$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));$("postq").placeholder=t('postPh');$("oslink").href='/examples/eco-crm/?lang='+lang+'&niche=biz';draw()}
document.addEventListener("click",e=>{const b=e.target.closest('[data-v]');if(b){$$(".view").forEach(v=>v.classList.remove("on"));$("v-"+b.dataset.v).classList.add("on");$$(".tabs button").forEach(x=>x.classList.toggle("on",x===b));window.scrollTo({top:0})}});
$$('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('vaxo_demo_lang',lang)}catch{}applyLang()});
$("copy").onclick=()=>{try{navigator.clipboard.writeText("orbit.example/?ref=mira-7k2")}catch(e){}toast(t('copied'))};
$("sim").onclick=()=>{s.clicks++;if(Math.random()<.6){s.signups++;toast(t('signed'))}else toast(t('clicked'));
 if(s.signups%3===0&&Math.random()<.8){s.paid++;const sale=[400,600,900][Math.floor(Math.random()*3)];s.earned+=Math.round(sale*L[lv()][1]/100);s.pend.unshift(["T","N",sale,"pending"]);toast(t('sale'));confetti()}
 draw()};
$("withdraw").onclick=()=>{const a=parseInt($("wtx").textContent.replace(/\D/g,""))||0;if(!a){toast(t('none'));return}s.paidOut+=a;draw();toast(t('paid').replace('{a}',a))};
$("c1").oninput=calc;$("c2").oninput=calc;
$("postf").onsubmit=async e=>{e.preventDefault();const q=$("postq").value.trim()||t('postPh');const o=$("posto");o.textContent='…';
 try{const r=await fetch('/api/demo/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang,brand:'Orbit Partners',mode:'chat',role:'an AI coach for affiliate partners of Orbit (a business software). Write ONE ready, honest, personal social post the partner can publish with their link: a hook, 2-3 short lines about the benefit, a soft call to action, no fake numbers or promises of income. Put the post in "text", ids empty',items:[{id:'orbit',t:'Orbit — simple software that helps small businesses get more clients'}],q:'Where and for whom: '+q})});const j=await r.json();o.textContent=j.ok?j.text:t('busy')}catch{o.textContent=t('busy')}};
applyLang();
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[data-vax]');if(a)a.href=(lang==='en'?'/':'/'+lang+'/')+'?vax='+a.dataset.vax},true);
</script></body></html>
