<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurelia Skin Clinic · Vaxo demo</title>
<meta name="description" content="Demo by Vaxo: an aesthetic clinic with an AI manager, treatment finder, online booking, client app, clinic CRM and referrals." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F3F2EE;--card:#FFFFFF;--ink:#1F2B26;--mut:#6B746F;--line:#E1E0DA;--sage:#DCE3DA;--deep:#23362E;--clay:#B9785B;--ok:#3E7A57;--warn:#C7893B;--r:22px;--serif:'Instrument Serif',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.serif{font-family:var(--serif);font-weight:400}
.k{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}
.demo{background:var(--deep);color:#DCE6DF;font-size:12.5px}
.demo .wrap{display:flex;align-items:center;gap:12px;min-height:44px;flex-wrap:wrap}
.demo b{color:#E4A93F}
.demo nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.demo nav button{background:none;border:0;color:#B9C7BE;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:500}
.demo nav button[aria-pressed=true]{background:#F3F2EE;color:var(--deep)}
.langs button{background:none;border:0;color:#8FA197;padding:4px 6px;font-size:12px;font-weight:600}
.langs button[aria-pressed=true]{color:#fff}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
header.top .wrap{display:flex;align-items:center;gap:24px;min-height:70px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:28px}
.logo i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6E3D6,#B9785B);display:block}
.nav{display:flex;gap:22px;margin-left:auto;font-weight:500;font-size:14px}.nav a{text-decoration:none;opacity:.8}.nav a:hover{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:13px 22px;font-weight:600;font-size:14px;background:var(--deep);color:#fff;text-decoration:none;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.clay{background:var(--clay)}
.btn:disabled{opacity:.45;transform:none;cursor:default}
.hero{padding:26px 0 40px}
.hgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:stretch}
.hcopy{background:var(--card);border-radius:32px;padding:clamp(28px,4vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.hcopy h1{font-family:var(--serif);font-weight:400;font-size:clamp(42px,4.8vw,70px);line-height:.98;margin:12px 0 16px;letter-spacing:-.01em}
.hcopy h1 em{color:var(--clay)}
.hcopy p{color:var(--mut);font-size:17px;max-width:44ch;margin:0}
.concierge{background:var(--bg);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.concierge label{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.concierge label span{background:var(--deep);color:#fff;border-radius:99px;font-size:11px;padding:2px 8px}
.cin{display:flex;gap:8px;background:var(--card);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.cin:focus-within{box-shadow:inset 0 0 0 2px var(--deep)}
.cin input{flex:1;border:0;outline:0;background:none;min-width:0}
.cin .btn{padding:10px 16px}
.chipsx{display:flex;gap:6px;flex-wrap:wrap}
.chipsx button{border:0;background:var(--card);border-radius:99px;padding:6px 11px;font-size:12.5px;box-shadow:inset 0 0 0 1px var(--line)}
.hphoto{position:relative;border-radius:32px;overflow:hidden;min-height:520px}
.hphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.float{position:absolute;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:18px;padding:12px 14px;font-size:13px;box-shadow:0 18px 40px -20px rgba(0,0,0,.35);animation:bob 6s ease-in-out infinite}
.float b{display:block;font-size:20px}
.f1{left:18px;bottom:18px}.f2{right:18px;top:18px;animation-delay:-3s}
@keyframes bob{50%{transform:translateY(-6px)}}
.trust{display:flex;gap:28px;flex-wrap:wrap;padding:6px 4px 0;color:var(--mut);font-size:13.5px}
.trust b{color:var(--ink)}
.sec{padding:70px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.sh h2{font-family:var(--serif);font-weight:400;font-size:clamp(36px,4.2vw,58px);line-height:1;margin:8px 0 0}
.sh p{color:var(--mut);max-width:44ch;margin:0}
.airesult{display:none;background:var(--deep);color:#EAF0EC;border-radius:var(--r);padding:18px 20px;margin-bottom:20px;gap:14px;align-items:flex-start}
.airesult.on{display:flex}
.airesult p{margin:0;font-size:16px}.airesult small{opacity:.7;display:block;margin-top:4px}
.airesult button{margin-left:auto;background:none;border:0;color:#fff;font-size:20px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.seg{display:flex;background:var(--card);border-radius:99px;padding:4px;box-shadow:inset 0 0 0 1px var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--deep);color:#fff}
.filterbar select{border:0;border-radius:99px;padding:10px 14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tcard{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 24px 50px -30px rgba(35,54,46,.45)}
.tcard .ph{aspect-ratio:16/11;overflow:hidden;position:relative}
.tcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.tcard:hover .ph img{transform:scale(1.04)}
.tcard .badge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:600}
.tcard .badge.ai{background:var(--clay);color:#fff}
.tcard .bd{padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tcard h3{margin:0;font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.05}
.tcard p{margin:0;color:var(--mut);font-size:14px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.meta span{background:var(--bg);border-radius:99px;padding:3px 9px;font-size:12px}
.tcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px}
.tcard .ft b{font-size:17px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
.skel{background:var(--card);border-radius:var(--r);height:340px;animation:pulse 1.1s infinite alternate}@keyframes pulse{to{opacity:.5}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panelimg{border-radius:32px;overflow:hidden;min-height:440px;position:relative}
.panelimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.steps{background:var(--card);border-radius:32px;padding:clamp(24px,4vw,48px)}
.steps h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.6vw,50px);line-height:1.02;margin:8px 0 22px}
.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.step span{width:42px;height:42px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-weight:700}
.step b{display:block}.step p{margin:2px 0 0;color:var(--mut);font-size:14px}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.doc{background:var(--card);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center}
.doc .av{width:64px;height:64px;border-radius:50%;background:center/cover;flex-shrink:0}
.doc b{display:block}.doc small{color:var(--mut)}
.revs{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px}
.rv{background:var(--card);border-radius:var(--r);padding:22px}
.rv p{font-family:var(--serif);font-size:23px;line-height:1.2;margin:8px 0}
.rv.sum{background:var(--sage)}
.rv.sum p{font-family:var(--sans);font-size:15px;line-height:1.55}
.stars{color:var(--warn);letter-spacing:1px}
footer{background:var(--deep);color:#C8D3CC;padding:50px 0 28px;margin-top:40px;font-size:14px}
footer .wrap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
footer h5{margin:0 0 10px;color:#fff;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
footer p{margin:5px 0}
.fine{grid-column:1/-1;border-top:1px solid #3B5047;padding-top:16px;font-size:12.5px;color:#8FA197}
.view[hidden]{display:none}
.app{padding:34px 0 70px}
.app h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,4.6vw,62px);line-height:1;margin:8px 0}
.lead{color:var(--mut);max-width:62ch;margin:0 0 26px}
.box{background:var(--card);border-radius:var(--r);padding:22px;min-width:0}
.box h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
/* booking */
.bk{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.prog{display:flex;gap:6px;margin-bottom:18px}.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}.prog i.on{background:var(--deep)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{border:0;background:var(--bg);border-radius:16px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:inset 0 0 0 1.5px transparent}
.opt[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--deep);background:#fff}
.opt img,.opt .av{width:54px;height:54px;border-radius:12px;object-fit:cover;background:center/cover;flex-shrink:0}
.opt .av{border-radius:50%}
.opt small{color:var(--mut);display:block}
.days{display:flex;gap:8px;overflow:auto;padding-bottom:6px}
.day{border:0;background:var(--bg);border-radius:14px;padding:10px 12px;min-width:64px;text-align:center;font-size:13px}
.day b{display:block;font-size:20px}
.day[aria-pressed=true]{background:var(--deep);color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.slot{border:0;background:var(--bg);border-radius:12px;padding:10px;font-weight:600;font-size:14px}
.slot[aria-pressed=true]{background:var(--deep);color:#fff}
.slot:disabled{opacity:.35;text-decoration:line-through}
.slot.hot{box-shadow:inset 0 0 0 1.5px var(--clay)}
.inp{width:100%;border:0;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:10px;outline:0}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--deep)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mut);margin:6px 0}
.sum{position:sticky;top:90px}
.sum .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.sum .row span{color:var(--mut)}
.nav2{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.done{text-align:center;padding:30px 10px}
.done .ok{width:70px;height:70px;border-radius:50%;background:var(--sage);display:grid;place-items:center;margin:0 auto 14px;font-size:30px;color:var(--ok)}
/* phone */
.phonewrap{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
.phone{width:330px;height:676px;border-radius:48px;background:#111;padding:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.screen{width:100%;height:100%;border-radius:38px;background:var(--bg);overflow:auto;position:relative}
.screen::-webkit-scrollbar{display:none}
.ps{padding:44px 16px 18px;display:flex;flex-direction:column;gap:12px}
.pcard{background:#fff;border-radius:18px;padding:14px}
.pcard.dark{background:var(--deep);color:#EAF0EC}
.ring{display:flex;gap:14px;align-items:center}
.ring svg{width:74px;height:74px;flex-shrink:0}
.pbar{height:6px;background:rgba(255,255,255,.2);border-radius:9px;margin-top:8px}.pbar i{display:block;height:100%;background:#E4A93F;border-radius:9px}
.pmini{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.pmini:last-child{border:0}
.pmini .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--deep);display:grid;place-items:center;font-size:11px;flex-shrink:0;margin-right:8px;background:none;padding:0}
.pmini .ck[aria-pressed=true]{background:var(--deep);color:#fff}
.feat{display:grid;gap:12px}
.feat div{background:var(--card);border-radius:18px;padding:16px 18px}
.feat b{display:block;margin-bottom:2px}
.feat p{margin:0;color:var(--mut);font-size:14px}
/* crm */
.kpi b{display:block;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi small{color:var(--mut)}.up{color:var(--ok)!important}
.sched .it{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sched .it:last-child{border:0}
.risk{font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.risk.h{background:#F6E1D6;color:#A04E2C}.risk.l{background:var(--sage);color:var(--ok)}
.risk.m{background:#F5EAD3;color:#8A6420}
.aibox{background:var(--deep);color:#EAF0EC;border-radius:var(--r);padding:22px}
.aibox h3{color:#B9C7BE}
.aibox li{margin:6px 0}
.aibox button{background:#EAF0EC;color:var(--deep);border:0;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;margin-top:4px}
.auto{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.auto:last-child{border:0}.auto div{flex:1}.auto small{display:block;color:var(--mut)}
.auto .g{color:var(--ok);font-size:13px;font-weight:600;white-space:nowrap}
.tgl{width:42px;height:24px;border-radius:99px;background:var(--line);border:0;position:relative;flex-shrink:0;transition:.2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl[aria-pressed=true]{background:var(--ok)}.tgl[aria-pressed=true]::after{left:21px}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:var(--bg);border-radius:16px;padding:10px;min-height:180px}
.col h4{margin:2px 4px 10px;font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between}
.lead-c{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px;cursor:grab;box-shadow:0 1px 0 var(--line)}
.lead-c small{color:var(--mut);display:block}
.lead-c.drag{opacity:.4}
.col.over{box-shadow:inset 0 0 0 2px var(--clay)}
svg.chart{width:100%;height:170px}
.src div{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:13.5px;margin:8px 0}
.src i{display:block;height:9px;border-radius:9px;background:var(--clay)}
.aiout{background:var(--bg);border-radius:14px;padding:14px;min-height:70px;white-space:pre-wrap;font-size:14.5px}
/* chat */
.fab{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;align-items:center;gap:10px;background:var(--deep);color:#fff;border:0;border-radius:99px;padding:8px 18px 8px 8px;box-shadow:0 16px 40px -16px rgba(0,0,0,.5);font-weight:600;font-size:14px}
.fab .av{width:36px;height:36px;border-radius:50%;background:url(/examples/img/au-doctor.webp) center/cover;position:relative}
.fab .av::after{content:'';position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#5EC27A;border:2px solid var(--deep)}
.chat{position:fixed;right:20px;bottom:20px;z-index:75;width:min(390px,calc(100% - 24px));height:min(610px,calc(100vh - 40px));background:var(--card);border-radius:24px;box-shadow:0 30px 70px -20px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px) scale(.98);opacity:0;pointer-events:none;transition:.3s}
.chat.on{transform:none;opacity:1;pointer-events:auto}
.ch{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--deep);color:#fff}
.ch .av{width:40px;height:40px;border-radius:50%;background:url(/examples/img/au-doctor.webp) center/cover}
.ch small{display:block;opacity:.75;font-size:12px}
.ch button{margin-left:auto;background:none;border:0;color:#fff;font-size:24px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.m{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45}
.m.a{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.m.u{background:var(--deep);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.m.typing{color:var(--mut)}
.mcards{display:flex;flex-direction:column;gap:6px;align-self:stretch}
.mc{background:#fff;border-radius:14px;padding:8px;display:flex;gap:10px;align-items:center;font-size:13px}
.mc img{width:46px;height:46px;border-radius:10px;object-fit:cover}
.mc b{display:block}
.mc button{margin-left:auto;border:0;background:var(--deep);color:#fff;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0;background:var(--bg)}
.quick button{border:0;background:#fff;border-radius:99px;padding:6px 11px;font-size:12.5px}
.chat form{display:flex;gap:8px;padding:12px;background:var(--bg)}
.chat form input{flex:1;border:0;border-radius:99px;padding:12px 16px;outline:0;min-width:0;background:#fff}
.chat form button{border:0;background:var(--deep);color:#fff;border-radius:99px;padding:0 16px;font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--deep);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;z-index:90;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.guide{position:fixed;left:16px;bottom:16px;z-index:55;width:300px;background:var(--deep);color:#DCE6DF;border-radius:18px;font-size:13px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.guide .gh{display:flex;gap:8px;padding:11px 14px;cursor:pointer}.guide .gh b{color:#E4A93F}.guide .gh span:last-child{margin-left:auto}
.guide ol{margin:0;padding:0 16px 14px 32px}.guide li{margin:5px 0}.guide.min ol{display:none}
@media (max-width:1050px){.tgrid,.docs{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.kan{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .hgrid,.split,.g2,.g3,.bk,.revs,.phonewrap{grid-template-columns:1fr}
  .hphoto{min-height:360px}.panelimg{min-height:300px}
  .nav{display:none}.guide{display:none}
  .phone{margin:0 auto}
  footer .wrap{grid-template-columns:1fr}
  .sum{position:static}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .tgrid,.docs{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(3,1fr)}
  .kan{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}.kpi b{font-size:26px}
  .demo nav{margin-left:0}
  .fab .t{display:none}.fab{padding:6px}
  .phone{width:300px;height:620px}
  header.top .btn{padding:10px 14px;font-size:13px}

const B={step:0,t:null,d:null,day:0,slot:null,done:false};

function renderStep(){
  const li=LI(),el=$('[data-step]');
  $$('[data-prog] i').forEach((x,i)=>x.classList.toggle('on',i<=B.step));
  $('[data-back]').style.visibility=B.step&&!B.done?'visible':'hidden';
  $('[data-next]').style.display=B.done?'none':'';
  $('[data-next]').textContent=B.step===3?t('confirmB'):t('next');
  if(B.done){el.innerHTML=`<div class="done"><div class="ok">✓</div><h2 class="serif" style="font-size:40px;margin:0">${t('doneH')}</h2><p style="color:var(--mut)">${t('doneP')}</p><button class="btn soft" data-again>${t('again')}</button></div>`}
  else if(B.step===0)el.innerHTML=`<h3>${t('s1')}</h3><div class="opts">${T.map(x=>`<button class="opt" data-pt="${x.id}" aria-pressed="${B.t===x.id}"><img src="${im(x.img)}" alt=""/><span><b>${x.n[li]}</b><small>${x.min} ${t('min')} · $${x.p}</small></span></button>`).join('')}</div>`;
  else if(B.step===1)el.innerHTML=`<h3>${t('s2')}</h3><div class="opts"><button class="opt" data-pd="any" aria-pressed="${B.d==='any'}"><span class="av" style="background:var(--sage);display:grid;place-items:center">✦</span><span><b>${t('anyone')}</b><small>${t('anyoneS')}</small></span></button>${D.map(d=>`<button class="opt" data-pd="${d.id}" aria-pressed="${B.d===d.id}"><span class="av" style="background-image:url(${im(d.img)})"></span><span><b>${d.n}</b><small>${d.r[li]}</small></span></button>`).join('')}</div>`;
  else if(B.step===2){const ds=days();el.innerHTML=`<h3>${t('s3')}</h3><div class="days">${ds.map((d,i)=>`<button class="day" data-pday="${i}" aria-pressed="${B.day===i}">${d.toLocaleDateString(loc(),{weekday:'short'})}<b>${d.getDate()}</b></button>`).join('')}</div><div class="slots">${slotsFor(B.day).map(s=>`<button class="slot ${s.hot?'hot':''}" data-ps="${s.s}" ${s.busy?'disabled':''} aria-pressed="${B.slot===s.s}">${s.s}</button>`).join('')}</div>`}
  else el.innerHTML=`<h3>${t('s4')}</h3><input class="inp" data-nm placeholder="${esc(t('name'))}"/><input class="inp" data-ph placeholder="${esc(t('phone'))}"/><textarea class="inp" rows="2" placeholder="${esc(t('note'))}"></textarea><label class="chk"><input type="checkbox" checked/> ${t('agree')}</label>`;
  const tr=T.find(x=>x.id===B.t),dc=D.find(d=>d.id===B.d),day=days()[B.day];
  $('[data-sum]').innerHTML=`<div class="row"><span>${t('rTreat')}</span><b>${tr?tr.n[li]:'—'}</b></div><div class="row"><span>${t('rDoc')}</span><b>${B.d==='any'?t('anyone'):dc?dc.n:'—'}</b></div><div class="row"><span>${t('rTime')}</span><b>${B.slot?day.toLocaleDateString(loc(),{day:'numeric',month:'short'})+', '+B.slot:'—'}</b></div><div class="row"><span>${t('rPrice')}</span><b>${tr?'$'+tr.p:'—'}</b></div>`;
}
$('[data-step]').addEventListener('click',e=>{
  const b=e.target.closest('[data-pt],[data-pd],[data-pday],[data-ps],[data-again]');if(!b)return;
  if(b.dataset.pt)B.t=b.dataset.pt;if(b.dataset.pd)B.d=b.dataset.pd;if(b.dataset.pday){B.day=+b.dataset.pday;B.slot=null}if(b.dataset.ps)B.slot=b.dataset.ps;
  if(b.hasAttribute('data-again'))Object.assign(B,{step:0,t:null,d:null,day:0,slot:null,done:false});
  renderStep();
});
$('[data-next]').addEventListener('click',()=>{
  const need=[B.t,B.d,B.slot][B.step];
  if(B.step<3&&!need){toast(t('pick'));return}

$('[data-gen]')?.addEventListener('click',async()=>{
  const q=$('[data-gen-in]').value.trim()||t('genPh').replace(/^[^:]*:\s*/,'').replace(/[«»“”"]/g,'');const o=$('[data-gen-out]');o.textContent=t('genWait');
  const r=await ai({role:'the clinic manager replying publicly to a client review: warm, specific, professional, 2-4 sentences, thank them, address any problem honestly, invite back. Put the reply in "text"; ids may be empty',q:'Client review: '+q,mode:'chat'});
  o.textContent=r?r.text:t('genErr');
});
function renderRef(){$('[data-topr]').innerHTML=[['@glowwith.mia','blogger',41,'$1,180'],['Emily R.','client',9,'4,500 pts'],['@skin.notes','blogger',27,'$760'],['Daria K.','client',6,'3,000 pts']].map(([n,k,c,v])=>`<div class="pmini" style="font-size:14px"><span><b>${n}</b> <small style="color:var(--mut)">· ${c}</small></span><b>${v}</b></div>`).join('')}

// chat
function addMsg(r,text,ids){const m=document.createElement('div');m.className='m '+r;m.textContent=text;$('[data-msgs]').append(m);
  if(ids&&ids.length){const li=LI(),w=document.createElement('div');w.className='mcards';w.innerHTML=ids.map(id=>T.find(x=>x.id===id)).filter(Boolean).map(x=>`<div class="mc"><img src="${im(x.img)}" alt=""/><span><b>${x.n[li]}</b>${x.min} ${t('min')} · $${x.p}</span><button data-bookt="${x.id}">${t('bookIt')}</button></div>`).join('');$('[data-msgs]').append(w)}
  $('[data-msgs]').scrollTop=1e6;return m}
async function ask(q){addMsg('u',q);$('[data-quick]').innerHTML='';const w=addMsg('a typing',t('think'));const r=await ai({q,mode:'chat',history:hist.slice(-6)});w.remove();if(!r){addMsg('a',t('aiErr'));return}hist.push({role:'u',text:q},{role:'a',text:r.text});addMsg('a',r.text,r.ids)}
$('[data-quick]').addEventListener('click',e=>{const b=e.target.closest('button');if(b)ask(b.textContent)});
$('[data-chat-form]').addEventListener('submit',e=>{e.preventDefault();const i=$('[data-chat-in]');const q=i.value.trim();if(!q)return;i.value='';ask(q)});
$('[data-chat-open]').addEventListener('click',()=>{$('[data-chat]').classList.add('on');$('[data-chat-open]').style.display='none';if(innerWidth>700)setTimeout(()=>$('[data-chat-in]').focus(),200)});
$('[data-chat-close]').addEventListener('click',()=>{$('[data-chat]').classList.remove('on');$('[data-chat-open]').style.display=''});
$('[data-msgs]').addEventListener('click',e=>{if(e.target.closest('[data-bookt]')){$('[data-chat]').classList.remove('on');$('[data-chat-open]').style.display=''}});

let osOn=0;function view(v){if(v==='os'&&!osOn){osOn=1;VaxoOS.mount(document.querySelector('[data-os]'),{lang,niche:'clinic',accent:'#23362E',accent2:'#B9785B'})}$$('[data-view]').forEach(s=>s.hidden=s.dataset.view!==v);$$('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));window.scrollTo({top:0})}
$$('[data-v]').forEach(b=>b.addEventListener('click',()=>{view(b.dataset.v);if(b.dataset.v==='book')renderStep()}));
$$('[data-l]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;try{localStorage.setItem('aur_lang',lang)}catch{};applyLang();if(window.VaxoOS&&osOn)VaxoOS.lang(lang)}));
$('[data-guide-t]').addEventListener('click',()=>$('[data-guide]').classList.toggle('min'));
if(innerWidth<1400)$('[data-guide]').classList.add('min');
applyLang();
document.addEventListener('click',e=>{if(e.target.closest('[data-goos]'))view('os')});
</script>
