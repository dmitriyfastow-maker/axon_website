<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vax</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header><img src="icons/32.png" alt=""><b>Vax</b><span id="site"></span></header>
<main id="log"></main>
<section id="sign" hidden>
  <p data-t="signTxt"></p>
  <button class="pri" id="signBtn" data-t="signBtn"></button>
</section>
<form id="form">
  <textarea id="goal" rows="3" data-tp="ph"></textarea>
  <div class="row">
    <button class="pri" id="go" type="submit" data-t="go"></button>
    <button class="sec" id="stop" type="button" data-t="stop" hidden></button>
  </div>
  <small data-t="rules"></small>
</form>
<script src="panel.js"></script>
</body>
</html>
